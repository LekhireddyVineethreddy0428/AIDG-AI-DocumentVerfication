# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: aidgverification
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: AIRDIT_HANA_VSH
          url: http://airdithanaprd:44388
          client: '400'
        app:
          name: ZAIDGVIAP
          description: Verification application of digital documents
          package: ZQU-DG-FND
          transport: VSHK900039
        exclude:
          - /test/
